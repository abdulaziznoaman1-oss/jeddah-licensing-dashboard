services:
  - type: web
    name: jeddah-licensing-dashboard
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: licensing-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: VIEW_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
