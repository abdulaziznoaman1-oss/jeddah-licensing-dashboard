# Optional Blueprint for a disposable demonstration only.
# WARNING: Free services do not provide a persistent disk. Uploaded data can be lost on restart.
services:
  - type: web
    name: jeddah-licensing-dashboard
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: VIEW_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
